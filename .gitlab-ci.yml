# ---------------------------------------------------------------------------
# Funcoes customizadas
# ---------------------------------------------------------------------------

.functions: &functions |
  function deploy() {
    mkdir -p ~/.kube

    printf '%s' "$KUBE_CONFIG" > ~/.kube/config
    chmod 600 ~/.kube/config

    sed -e "s/{{COMMIT_ID}}/$CI_COMMIT_SHORT_SHA/g" \
        -e "s/{{JOB_ID}}/$CI_JOB_ID/g" \
        -e "s/{{QTD_REPLICAS}}/$QTD_REPLICAS/g" \
        -e "s/{{QTD_CPU}}/$QTD_CPU/g" \
        -e "s/{{QTD_MEMORIA}}/$QTD_MEMORIA/g" \
        ./kube/deployment.yaml > deployment-temp.yaml

    echo "Deployment que será aplicado:"
    cat deployment-temp.yaml

    if grep -q "{{" deployment-temp.yaml; then
      echo "ERRO: existem variáveis que não foram substituídas no deployment."
      exit 1
    fi

    kubectl apply -f ./kube/service.yaml
    kubectl apply -f ./kube/ingress.yaml
    kubectl apply -f deployment-temp.yaml

    kubectl rollout status \
      deployment/${APP_NAME}-deployment \
      --timeout=10m || (
        echo "Falha no rollout. Exibindo detalhes do Deployment e dos Pods."

        kubectl describe deployment/${APP_NAME}-deployment || true
        kubectl describe pod -l jobid="$CI_JOB_ID" || true
        kubectl logs \
          --tail=10000 \
          --all-containers=true \
          -l jobid="$CI_JOB_ID" || true

        exit 1
      )
  }

before_script:
  - *functions
